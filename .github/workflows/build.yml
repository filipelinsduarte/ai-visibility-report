name: Build & Deploy AI Visibility Report

on:
  schedule:
    - cron: '0 6 * * 1,4'  # Every Monday and Thursday at 6am UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config.json'
      - 'build_fast.py'
      - 'template.html'
      - '.github/workflows/build.yml'

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build report
        env:
          AIPEEKABOO_API_KEY: ${{ secrets.AIPEEKABOO_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OUTPUT_FILE: index.html
        run: python build_fast.py --config config.json

      - name: Prepare _site directory
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Scheduled report build failed — ${new Date().toISOString().slice(0,10)}`,
              body: `The scheduled AI Visibility Report build failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['build-failure']
            });
