name: Build & Deploy AI Visibility Report

on:
  schedule:
    - cron: '0 6 * * 1,4'  # Every Monday and Thursday at 6am UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build report
        env:
          AIPEEKABOO_API_KEY: ${{ secrets.AIPEEKABOO_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OUTPUT_FILE: index.html
        run: python build_fast.py --config config.json

      - name: Prepare _site directory
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
